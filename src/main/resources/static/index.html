<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ExamMaster Pro · Premium Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div class="app-backdrop"></div>
<div id="authView" class="auth-shell">
    <section class="auth-panel">
        <div class="auth-hero">
            <p class="eyebrow">Professional Exam Seat Allocation</p>
            <h1>ExamMaster Pro</h1>
            <p class="muted">Manage buildings, halls, students, invigilators, allocation, import & export, complaints, and analytics from one secure dashboard.</p>
        </div>
    </section>
    <section class="login-box">
        <div class="auth-card">
            <div class="auth-card-head">
            <div class="auth-brand">
                <div class="brand-mark auth-brand-mark">EM</div>
                <div>
                    <p class="eyebrow">ExamMaster Pro</p>
                    <h2>Sign in to your account</h2>
                </div>
            </div>
        </div>
            <ul class="nav nav-tabs" id="authTabs">
                <li class="nav-item"><button class="nav-link active" data-auth="login">Login</button></li>
                <li class="nav-item"><button class="nav-link" data-auth="register">Register</button></li>
            </ul>
            <form id="loginForm" class="form-stack mt-4">
                <input class="form-control" name="username" placeholder="Username" required>
                <input class="form-control" name="password" type="password" placeholder="Password" required>
                <button class="btn btn-primary w-100">Login</button>
            </form>
            <form id="registerForm" class="form-stack mt-4 d-none">
                <input class="form-control" name="collegeName" placeholder="College Name" required>
                <input class="form-control" name="username" placeholder="Username" required>
                <input class="form-control" name="email" type="email" placeholder="Email" required>
                <input class="form-control" name="password" type="password" placeholder="Password" required>
                <input class="form-control" name="confirmPassword" type="password" placeholder="Confirm Password" required>
                <button class="btn btn-primary w-100">Create Account</button>
            </form>
        </div>
        <!-- Student portal moved to Import & Export center for admin/workspace lookups -->
    </section>
</div>

<div id="appView" class="app-shell d-none">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-mark">EM</div>
            <div><strong>ExamMaster</strong><span>Pro Console</span></div>
        </div>
        <nav id="nav"></nav>
    </aside>
    <main class="workspace">
        <header class="topbar">
            <div>
                <p id="workspaceBanner" class="eyebrow mb-1"></p>
                <h2 id="pageTitle">Dashboard</h2>
            </div>
            <div class="top-actions">
                <select id="workspaceSelect" class="form-select form-select-sm d-none"></select>
                <button id="logoutBtn" class="btn btn-outline-light btn-sm">Logout</button>
            </div>
        </header>
        <section id="content"></section>
    </main>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toast" class="toast text-bg-dark border border-primary" role="alert">
        <div class="toast-body"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/lucide@0.470.0/dist/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
